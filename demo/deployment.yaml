apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deployment
  name: nginx-deployment
  annotations: 
    operator.1password.io/auto-restart: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deployment
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx-deployment
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
        env: 
          - name: DEMO_SECRET
            valueFrom: 
              secretKeyRef:
                key: credential
                name: demo-secret
        volumeMounts: 
          - name: templates
            mountPath: /etc/nginx/templates
      volumes: 
      - name: templates
        configMap:
          name: nginx-template
        
status: {}
